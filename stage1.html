<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stage1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="heading1">
        <h1>Liberation</h1>
    </div>

    <div class="game1">
        <video class="yes-video" muted preload="auto">
            <source src="./asset/yes-video.mp4" type="video/mp4">
        </video>
        <img src="./asset/wine.png" class="wine">
        <img src="./asset/paper.png" class="paper">
        <img src="./asset/cake.png" class="cake">
        <img src="./asset/yes-button.png" class="yes-button">
    </div>

    <div class="game2">
        <p class="money-text">Click to give him money</p>
        <img src="./asset/human-money.gif" class="human-money">
        <img src="./asset/coin.PNG" class="coin">
        <img src="./asset/coin2.PNG" class="coin2">
        <img src="./asset/coin3.PNG" class="coin3">
        <img src="./asset/coin4.PNG" class="coin4">
    </div>
    </div>

    <div id="dialogue-box">
        <img id="portrait" src="./asset/human.PNG" />

        <div id="dialogue-content">
            <div id="speaker">HUMAN</div>
            <div id="text"></div>
        </div>
        <audio id="typeSound" src="./asset/typerwriter.wav" preload="auto"></audio>

        <div id="continue">click Z to continue</div>
    </div>



    <script src="stage1.js"></script>
</body>

</html>
