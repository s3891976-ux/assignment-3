<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stage3.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="heading3">
        <h1>Accumulated Loss</h1>
    </div>

    <div class="game4">
        <div class="album-close">
            <img src="./asset/album-close.PNG" class="album-close-img">
        </div>
        <div class="album-open">

            <img src="./asset/img2.PNG" class="img2">
            <img src="./asset/album-open.PNG" class="album-open-img">
        </div>
        <div class="family">
            <img src="./asset/img1.PNG" class="img1">
        </div>

        <p class="draw">
            Draw on the album to see what will happnen
        </p>




        <div id="dialogue-box">
            <img id="portrait" src="./asset/human.PNG" />

            <div id="dialogue-content">
                <div id="speaker">HUMAN</div>
                <div id="text"></div>
            </div>
            <audio id="typeSound" src="./asset/typerwriter.wav" preload="auto"></audio>

            <div id="continue">click Z to continue</div>
        </div>
        <p id="skip2">Press the album to open it</p>
        <div class="popup">
            <h2>Do you want to remember?</h2>
            <div class="popup-buttons">
                <button class="popup-btn yes-btn">Yes</button>
                <button class="popup-btn no-btn">No</button>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
        <script src="sketch2.js"></script>
        <script src="stage3.js"></script>
</body>

</html>
